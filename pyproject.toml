[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grandnexus-rebuild"
version = "6.4.0.post0"
description = "Incremental recovery of GrandNexus v6.4 from a notebook export"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
api = ["fastapi", "uvicorn", "sse-starlette"]
ml = ["torch", "scikit-learn", "sentence-transformers"]
robotics = ["gymnasium", "pybullet"]
observability = ["prometheus-client", "opentelemetry-sdk"]

[project.scripts]
grandnexus = "grandnexus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
